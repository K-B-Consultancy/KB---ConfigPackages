name: Dependabot Auto-Merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  workflow_run:
    workflows:
      - PR Checks
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-automerge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Ensure dependencies label only
        id: gate
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const number =
              context.payload.pull_request?.number ??
              context.payload.workflow_run?.pull_requests?.[0]?.number ??
              context.payload.check_suite?.pull_requests?.[0]?.number;

            if (!number) {
              core.setOutput('should_run', 'false');
              console.log('No pull request number found in event payload. Skipping automerge.');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number
            });

            const prAuthor = pr.data.user?.login;
            if (prAuthor !== 'dependabot[bot]' && prAuthor !== 'dependabot') {
              core.setOutput('should_run', 'false');
              console.log(`PR author is ${prAuthor}. Skipping automerge.`);
              return;
            }

            const labelNames = (pr.data.labels || []).map(l => l.name);
            if (!labelNames.includes('dependencies')) {
              core.setOutput('should_run', 'false');
              console.log('PR does not have the "dependencies" label. Skipping automerge.');
              return;
            }

            // Remove any other labels
            const otherLabels = labelNames.filter(l => l !== 'dependencies');
            for (const label of otherLabels) {
              console.log(`Removing label: ${label}`);
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: number,
                name: label
              });
            }

            core.setOutput('should_run', 'true');
            core.setOutput('pr_number', `${number}`);

      - name: Get PR details
        id: pr
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/github-script@v9.0.0
        env:
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: Number(process.env.PR_NUMBER)
            });

            // Extract version numbers from PR title (e.g., "Bump package from 1.0.0 to 2.0.0")
            const titleMatch = pr.data.title.match(/from\s+([^\s]+)\s+to\s+([^\s]+)/i);
            let isMajor = false;
            let isMinor = false;

            if (titleMatch) {
              const fromVersion = titleMatch[1];
              const toVersion = titleMatch[2];

              // Parse semantic versions
              const versionRegex = /^v?(\d+)\.(\d+)\.(\d+)/;
              const fromMatch = fromVersion.match(versionRegex);
              const toMatch = toVersion.match(versionRegex);

              if (fromMatch && toMatch) {
                const [, fromMajor, fromMinor, fromPatch] = fromMatch;
                const [, toMajor, toMinor, toPatch] = toMatch;

                if (fromMajor !== toMajor) {
                  isMajor = true;
                  console.log(`Major version change: ${fromVersion} -> ${toVersion}`);
                } else if (fromMinor !== toMinor) {
                  isMinor = true;
                  console.log(`Minor version change: ${fromVersion} -> ${toVersion}`);
                } else {
                  console.log(`Patch version change: ${fromVersion} -> ${toVersion}`);
                }
              }
            }

            core.setOutput('is_major', isMajor.toString());
            core.setOutput('is_minor', isMinor.toString());
            core.setOutput('is_draft', pr.data.draft.toString());

      - name: Auto-merge if conditions are met
        if: steps.gate.outputs.should_run == 'true' && steps.pr.outputs.is_draft == 'false' && steps.pr.outputs.is_major == 'false'
        uses: actions/github-script@v9.0.0
        env:
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              const result = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: Number(process.env.PR_NUMBER),
                merge_method: 'squash'
              });
              console.log('✅ PR auto-merged successfully');
            } catch (error) {
              if (error.status === 405) {
                console.log('⏳ Merge not ready yet (still waiting for checks or branch protection)');
              } else {
                console.error('❌ Failed to merge:', error.message);
              }
            }
