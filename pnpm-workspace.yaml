packages:
  - 'packages/*'
allowBuilds:
  # unrs-resolver ships prebuilt binaries; its postinstall build fallback is not needed
  unrs-resolver: false
# No package age gate in pnpm: .ai-docs/00-org-wide/DEPENDENCIES.md § Supply chain guardrails says why.
# It is 0 rather than removed because pnpm 11 applies a 1-day gate when the setting is missing.
minimumReleaseAge: 0
